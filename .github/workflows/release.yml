# 发版工作流：推送形如 `0.1.2` 的 tag（不带 v 前缀）时自动构建并创建 GitHub Release。
#
# tag 必须与 manifest.json 的 version 完全一致 —— Obsidian 按 manifest 里的 version
# 去下载对应 tag 的 Release 附件，tag 对不上会直接 404。
#
# 首次使用需在仓库设置里开启写权限：Settings → Actions → General →
# Workflow permissions → Read and write permissions。
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 生成 artifact attestation（构建溯源签名）必需 —— 官方 actions/attest-build-provenance
      # 用 OIDC 换取签名凭证，没有 id-token: write 会直接失败。
      # 仓库侧还需 Settings → Actions → General → Workflow permissions 允许
      # Read and write permissions 且启用 OIDC（API：PUT /actions/permissions，
      # body 需带 enabled:true，否则 422）。
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $TAG 与 manifest.json 的 version $VERSION 不一致"
            exit 1
          fi
          echo "tag $TAG 与 manifest.json 版本一致"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Stage release assets
        # styles.css 统一从 src/ 取，再重命名为插件约定名。
        # 不用根目录的 styles.css：那是构建产物（.gitignore 排除），
        # `npm run build` 也不会生成它——本项目的 CSS 走 deploy.mjs 直接复制到库目录。
        run: cp src/styles.css styles.css

      - name: Build release notes from manifest
        # 插件名与 id 一律由 scripts/build-notes.mjs 从 manifest.json 读取，
        # 不在任何地方硬编码。原因有二：
        #   1. 插件改名（社区要求 name 为纯 ASCII）时，硬编码的说明会漏改，
        #      Release 页面仍显示旧名，与 manifest/README/页签标题不一致；
        #   2. 说明含 Markdown（反引号、代码块），在 YAML 内嵌易踩转义坑。
        run: node scripts/build-notes.mjs RELEASE_NOTES.md

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            main.js
            manifest.json
            styles.css
          body_path: RELEASE_NOTES.md

      # ---- 构建溯源签名（2026-10-07，社区扫描 Recommendation）----
      # 必须放在 Release 创建**之后**：attest-build-provenance 是对
      # 「已存在的产物」签名并生成 *.sigstore.json 附加到该 Release，
      # 顺序反了会找不到资产。
      #
      # 作用：让用户能密码学验证 main.js 确实由本仓库源码构建而成，
      # 而非第三方塞进去的。验证命令：
      #   gh attestation verify main.js --repo vilifetime/obsidian-caldav-calendar-tasks
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
