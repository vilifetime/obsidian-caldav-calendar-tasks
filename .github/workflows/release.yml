# 发版工作流：推送形如 `0.1.2` 的 tag（不带 v 前缀）时自动构建并创建 GitHub Release。
#
# tag 必须与 manifest.json 的 version 完全一致 —— Obsidian 按 manifest 里的 version
# 去下载对应 tag 的 Release 附件，tag 对不上会直接 404。
#
# 首次使用需在仓库设置里开启写权限：Settings → Actions → General →
# Workflow permissions → Read and write permissions。
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $TAG 与 manifest.json 的 version $VERSION 不一致"
            exit 1
          fi
          echo "tag $TAG 与 manifest.json 版本一致"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            main.js
            manifest.json
            src/styles.css
          body: |
            ${{ github.ref_name }}

            安装方式：在 Obsidian 中打开「设置 → 第三方插件 → 浏览」，搜索 CalDAV 日历任务；
            或从本Release 下载 main.js、manifest.json、styles.css 三个文件放入
            `<库名>/.obsidian/plugins/caldav-calendar-tasks/`。
